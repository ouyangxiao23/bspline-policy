name: microwave_bsp
_target_: diffusion_policy.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
task_name: TurnOffMicrowave
shape_meta: ${task.shape_meta}
exp_name: bsp
horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: false
keypoint_visible_rate: 1.0
obs_as_global_cond: true
policy:
  _target_: bspline_policy.policy.diffusion_unet_bspline_image_policy.DiffusionUnetBSplineImagePolicy
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  horizon: ${horizon}
  n_action_steps: 16
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 16
  obs_as_global_cond: ${obs_as_global_cond}
  crop_shape:
  - 116
  - 116
  diffusion_step_embed_dim: 128
  down_dims:
  - 256
  - 512
  - 1024
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  bspline_degree: ${task.dataset.bspline_degree}
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999
dataloader:
  batch_size: 64
  num_workers: 4
  shuffle: true
  pin_memory: true
  persistent_workers: false
val_dataloader:
  batch_size: 64
  num_workers: 2
  shuffle: false
  pin_memory: true
  persistent_workers: false
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  weight_decay: 1.0e-06
training:
  device: cuda:0
  seed: 42
  debug: false
  resume: true
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 601
  gradient_accumulate_every: 1
  use_ema: true
  rollout_every: 1000000
  checkpoint_every: 20
  val_every: 1
  sample_every: 20
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
logging:
  project: bsp_microwave_reproduction
  resume: true
  mode: offline
  name: microwave_bsp_seed42
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
  id: null
  group: null
checkpoint:
  topk:
    monitor_key: val_loss
    mode: min
    k: 3
    format_str: epoch={epoch:04d}-val_loss={val_loss:.4f}.ckpt
  save_last_ckpt: true
  save_last_snapshot: false
task:
  name: TurnOffMicrowave
  shape_meta:
    obs:
      robot0_agentview_left_image:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      robot0_agentview_right_image:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 128
        - 128
        type: rgb
      robot0_eef_pos:
        shape:
        - 3
        type: low_dim
      robot0_eef_quat:
        shape:
        - 4
        type: low_dim
      robot0_gripper_qpos:
        shape:
        - 2
        type: low_dim
      robot0_base_pos:
        shape:
        - 3
        type: low_dim
      robot0_base_quat:
        shape:
        - 4
        type: low_dim
      robot0_base_to_eef_pos:
        shape:
        - 3
        type: low_dim
      robot0_base_to_eef_quat:
        shape:
        - 4
        type: low_dim
    action:
      shape:
      - 12
  dataset:
    _target_: bspline_policy.dataset.robomimic_replay_bspline_image_dataset.RobomimicReplayBSplineImageDataset
    shape_meta:
      obs:
        robot0_agentview_left_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_agentview_right_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_eye_in_hand_image:
          shape:
          - 3
          - 128
          - 128
          type: rgb
        robot0_eef_pos:
          shape:
          - 3
          type: low_dim
        robot0_eef_quat:
          shape:
          - 4
          type: low_dim
        robot0_gripper_qpos:
          shape:
          - 2
          type: low_dim
        robot0_base_pos:
          shape:
          - 3
          type: low_dim
        robot0_base_quat:
          shape:
          - 4
          type: low_dim
        robot0_base_to_eef_pos:
          shape:
          - 3
          type: low_dim
        robot0_base_to_eef_quat:
          shape:
          - 4
          type: low_dim
      action:
        shape:
        - 12
    dataset_path: ${oc.env:MICROWAVE_DATASET}
    horizon: 16
    pad_before: 0
    pad_after: 0
    n_obs_steps: 2
    abs_action: false
    use_cache: true
    cache_decoded_replay: true
    cache_suffix: microwave_delta12_128_v1
    seed: 42
    val_ratio: 0.1
    chunk_size: 10
    bspline_degree: 3
    max_error: 0.002
    stride: 1
    relative_knots: false
  env_runner:
    _target_: microwave_support.OfflineRunner
